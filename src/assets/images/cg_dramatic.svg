<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0033"/>
      <stop offset="50%" style="stop-color:#330066"/>
      <stop offset="100%" style="stop-color:#1A0033"/>
    </linearGradient>
    <radialGradient id="spotLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF00FF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FF00FF;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect fill="url(#bgGrad)" width="1920" height="1080"/>

  <!-- Spotlight effect -->
  <ellipse cx="960" cy="540" rx="600" ry="400" fill="url(#spotLight)"/>

  <!-- Rain effect -->
  <g opacity="0.3">
    <line x1="100" y1="0" x2="80" y2="100" stroke="#00FFFF" stroke-width="1"/>
    <line x1="300" y1="50" x2="280" y2="150" stroke="#00FFFF" stroke-width="1"/>
    <line x1="500" y1="20" x2="480" y2="120" stroke="#00FFFF" stroke-width="1"/>
    <line x1="700" y1="80" x2="680" y2="180" stroke="#00FFFF" stroke-width="1"/>
    <line x1="900" y1="10" x2="880" y2="110" stroke="#00FFFF" stroke-width="1"/>
    <line x1="1100" y1="60" x2="1080" y2="160" stroke="#00FFFF" stroke-width="1"/>
    <line x1="1300" y1="30" x2="1280" y2="130" stroke="#00FFFF" stroke-width="1"/>
    <line x1="1500" y1="90" x2="1480" y2="190" stroke="#00FFFF" stroke-width="1"/>
    <line x1="1700" y1="40" x2="1680" y2="140" stroke="#00FFFF" stroke-width="1"/>
    <line x1="200" y1="200" x2="180" y2="300" stroke="#FF00FF" stroke-width="1"/>
    <line x1="400" y1="250" x2="380" y2="350" stroke="#FF00FF" stroke-width="1"/>
    <line x1="600" y1="180" x2="580" y2="280" stroke="#FF00FF" stroke-width="1"/>
    <line x1="800" y1="220" x2="780" y2="320" stroke="#FF00FF" stroke-width="1"/>
    <line x1="1000" y1="190" x2="980" y2="290" stroke="#FF00FF" stroke-width="1"/>
    <line x1="1200" y1="240" x2="1180" y2="340" stroke="#FF00FF" stroke-width="1"/>
    <line x1="1400" y1="210" x2="1380" y2="310" stroke="#FF00FF" stroke-width="1"/>
    <line x1="1600" y1="260" x2="1580" y2="360" stroke="#FF00FF" stroke-width="1"/>
    <line x1="1800" y1="170" x2="1780" y2="270" stroke="#FF00FF" stroke-width="1"/>
  </g>

  <!-- Neon signs simulation -->
  <rect x="100" y="100" width="200" height="80" rx="5" fill="none" stroke="#FF00FF" stroke-width="3" filter="url(#blur)" opacity="0.6"/>
  <rect x="1620" y="150" width="180" height="60" rx="5" fill="none" stroke="#00FFFF" stroke-width="3" filter="url(#blur)" opacity="0.6"/>

  <!-- Window frame -->
  <rect x="1400" y="200" width="400" height="600" fill="none" stroke="#333" stroke-width="10"/>
  <line x1="1600" y1="200" x2="1600" y2="800" stroke="#333" stroke-width="5"/>
  <line x1="1400" y1="500" x2="1800" y2="500" stroke="#333" stroke-width="5"/>

  <!-- Characters silhouette -->
  <ellipse cx="700" cy="750" rx="150" ry="300" fill="#1A0033" opacity="0.8"/>
  <ellipse cx="1200" cy="780" rx="140" ry="280" fill="#1A0033" opacity="0.8"/>

  <!-- Floor reflection -->
  <rect x="0" y="900" width="1920" height="180" fill="#000" opacity="0.5"/>
  <line x1="0" y1="900" x2="1920" y2="900" stroke="#FF00FF" stroke-width="2" opacity="0.5"/>

  <!-- Scanlines -->
  <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
    <line x1="0" y1="0" x2="4" y2="0" stroke="#000" stroke-width="1" opacity="0.1"/>
  </pattern>
  <rect fill="url(#scanlines)" width="1920" height="1080"/>
</svg>
