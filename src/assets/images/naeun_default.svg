<svg xmlns="http://www.w3.org/2000/svg" width="300" height="500" viewBox="0 0 300 500">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D0052;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0033;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect fill="none" width="300" height="500"/>

  <!-- Body silhouette -->
  <ellipse cx="150" cy="120" rx="55" ry="65" fill="url(#bodyGrad)" filter="url(#glow)"/>

  <!-- Hair -->
  <path d="M95 100 Q80 60 100 40 Q130 20 150 25 Q170 20 200 40 Q220 60 205 100 Q210 140 200 180 L100 180 Q90 140 95 100"
        fill="#1A0033" stroke="#FF00FF" stroke-width="1" opacity="0.8"/>

  <!-- Face outline -->
  <ellipse cx="150" cy="110" rx="45" ry="55" fill="#2D0052" stroke="#FF00FF" stroke-width="0.5"/>

  <!-- Eyes -->
  <ellipse cx="130" cy="100" rx="12" ry="8" fill="#000" stroke="#00FFFF" stroke-width="1"/>
  <ellipse cx="170" cy="100" rx="12" ry="8" fill="#000" stroke="#00FFFF" stroke-width="1"/>
  <circle cx="130" cy="100" r="4" fill="#FF00FF"/>
  <circle cx="170" cy="100" r="4" fill="#FF00FF"/>
  <circle cx="132" cy="98" r="1.5" fill="#FFF"/>
  <circle cx="172" cy="98" r="1.5" fill="#FFF"/>

  <!-- Mouth -->
  <path d="M140 130 Q150 135 160 130" stroke="#FF00FF" stroke-width="2" fill="none"/>

  <!-- Body -->
  <path d="M100 180 Q80 200 85 280 L85 450 Q85 480 115 480 L185 480 Q215 480 215 450 L215 280 Q220 200 200 180 Z"
        fill="url(#bodyGrad)" stroke="#FF00FF" stroke-width="1"/>

  <!-- Clothing details -->
  <path d="M100 180 L150 220 L200 180" stroke="#00FFFF" stroke-width="1" fill="none" opacity="0.5"/>
  <line x1="150" y1="220" x2="150" y2="400" stroke="#00FFFF" stroke-width="1" opacity="0.3"/>

  <!-- Name tag -->
  <rect x="100" y="460" width="100" height="25" rx="3" fill="#000" stroke="#FF00FF" stroke-width="1"/>
  <text x="150" y="478" text-anchor="middle" fill="#00FFFF" font-family="sans-serif" font-size="14" font-weight="bold">나은</text>

  <!-- Decorative elements -->
  <circle cx="80" cy="200" r="3" fill="#FF00FF" opacity="0.6"/>
  <circle cx="220" cy="200" r="3" fill="#00FFFF" opacity="0.6"/>
  <circle cx="70" cy="300" r="2" fill="#FF00FF" opacity="0.4"/>
  <circle cx="230" cy="300" r="2" fill="#00FFFF" opacity="0.4"/>
</svg>
