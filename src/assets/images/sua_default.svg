<svg xmlns="http://www.w3.org/2000/svg" width="300" height="500" viewBox="0 0 300 500">
  <defs>
    <linearGradient id="bodyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001a1a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect fill="none" width="300" height="500"/>

  <!-- Body silhouette -->
  <ellipse cx="150" cy="120" rx="55" ry="65" fill="url(#bodyGrad2)" filter="url(#glow2)"/>

  <!-- Hair (shorter style) -->
  <path d="M100 90 Q90 50 110 35 Q135 25 150 30 Q165 25 190 35 Q210 50 200 90 Q195 120 190 140 L110 140 Q105 120 100 90"
        fill="#001a1a" stroke="#00FFFF" stroke-width="1" opacity="0.8"/>

  <!-- Face outline -->
  <ellipse cx="150" cy="110" rx="45" ry="55" fill="#003333" stroke="#00FFFF" stroke-width="0.5"/>

  <!-- Eyes -->
  <ellipse cx="130" cy="100" rx="12" ry="8" fill="#000" stroke="#FF00FF" stroke-width="1"/>
  <ellipse cx="170" cy="100" rx="12" ry="8" fill="#000" stroke="#FF00FF" stroke-width="1"/>
  <circle cx="130" cy="100" r="4" fill="#00FFFF"/>
  <circle cx="170" cy="100" r="4" fill="#00FFFF"/>
  <circle cx="132" cy="98" r="1.5" fill="#FFF"/>
  <circle cx="172" cy="98" r="1.5" fill="#FFF"/>

  <!-- Mouth (slight smile) -->
  <path d="M138 128 Q150 138 162 128" stroke="#00FFFF" stroke-width="2" fill="none"/>

  <!-- Body -->
  <path d="M100 180 Q80 200 85 280 L85 450 Q85 480 115 480 L185 480 Q215 480 215 450 L215 280 Q220 200 200 180 Z"
        fill="url(#bodyGrad2)" stroke="#00FFFF" stroke-width="1"/>

  <!-- Clothing details -->
  <path d="M100 180 L150 210 L200 180" stroke="#FF00FF" stroke-width="1" fill="none" opacity="0.5"/>
  <line x1="150" y1="210" x2="150" y2="400" stroke="#FF00FF" stroke-width="1" opacity="0.3"/>
  <ellipse cx="150" cy="250" rx="20" ry="10" fill="none" stroke="#00FFFF" stroke-width="1" opacity="0.4"/>

  <!-- Name tag -->
  <rect x="100" y="460" width="100" height="25" rx="3" fill="#000" stroke="#00FFFF" stroke-width="1"/>
  <text x="150" y="478" text-anchor="middle" fill="#FF00FF" font-family="sans-serif" font-size="14" font-weight="bold">수아</text>

  <!-- Decorative elements -->
  <circle cx="80" cy="200" r="3" fill="#00FFFF" opacity="0.6"/>
  <circle cx="220" cy="200" r="3" fill="#FF00FF" opacity="0.6"/>
  <circle cx="70" cy="300" r="2" fill="#00FFFF" opacity="0.4"/>
  <circle cx="230" cy="300" r="2" fill="#FF00FF" opacity="0.4"/>
</svg>
